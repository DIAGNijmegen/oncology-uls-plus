# MSD Liver Lesion Dataset Configuration
# Medical Segmentation Decathlon - Task 3: Liver Tumors
# This config demonstrates the 'msd' adapter for Medical Segmentation Decathlon datasets
#
# Dataset structure:
#   /data/MSD/Task03_Liver/
#   ├── imagesTr/
#   │   ├── liver_0.nii.gz
#   │   ├── liver_1.nii.gz
#   │   └── ...
#   └── labelsTr/
#       ├── liver_0.nii.gz  (contains label 1=liver, label 2=lesions)
#       ├── liver_1.nii.gz
#       └── ...
#
# Run with: python uclp/uclp_preprocess.py --config configs/msd_liver.yaml

name: MSD_Liver
id: 31

# Adapter configuration - msd adapter
# Use this for Medical Segmentation Decathlon format (imagesTr/labelsTr)
adapter: msd
input_images: /path/to/your/dataset/MSD/Task03_Liver/imagesTr
input_labels: /path/to/your/dataset/MSD/Task03_Liver/labelsTr

# Label filtering for MSD datasets
# MSD Liver masks contain:
#   - Label 1: Liver organ (we don't want this)
#   - Label 2: Liver lesions/tumors (we want this)
# Keep only label 2 to extract lesions
# Output will be binarized to 0 (background) and 1 (lesion)
labels_to_keep: [2]

# Output directory
output_dir: /path/to/output/nnUNet_raw

# Crop parameters
crop_size: [128, 128, 64]  # [x, y, z] in voxels - lesion-centered subvolume size

# Augmentation parameters
num_augmentations: 3       # Generate 3 samples per lesion (1 centered + 2 augmented)
offset_range_mm: 10.0      # Maximum offset radius for spherical sampling (mm)

# mask exclusion 
min_lesion_size_voxels: 50  # Mininum mask size in voxels for the lesion to be included

# Reproducibility
random_seed: 42            # For deterministic augmentation
