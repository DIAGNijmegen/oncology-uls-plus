# ULS23 LIDC-IDRI Dataset Configuration
# Lung nodule dataset
#
# Run with: python uclp/uclp_preprocess.py --config configs/ULS23/uls23_lidc_idri.yaml

name: ULS23_LIDC_IDRI
id: 41

adapter: uls23
input_images: /path/to/your/dataset/ULS23/LIDC-IDRI/images
input_labels: /path/to/your/dataset/ULS23/LIDC-IDRI/labels

output_dir: /path/to/output/nnUNet_raw

crop_size: [128, 128, 64]
num_augmentations: 3
offset_range_mm: 10.0
min_lesion_size_voxels: 20
random_seed: 42
