# ULS23 Radboudumc Bone Dataset Configuration
# Bone lesion segmentation
#
# Run with: python uclp/uclp_preprocess.py --config configs/ULS23/uls23_radboudumc_bone.yaml

name: ULS23_Radboudumc_Bone
id: 46

adapter: uls23
input_images: /path/to/your/dataset/ULS23/ULS23_Radboudumc_Bone/images
input_labels: /path/to/your/dataset/ULS23/ULS23_Radboudumc_Bone/labels

output_dir: /path/to/output/nnUNet_raw

crop_size: [128, 128, 64]
num_augmentations: 3
offset_range_mm: 10.0
min_lesion_size_voxels: 20
random_seed: 42
