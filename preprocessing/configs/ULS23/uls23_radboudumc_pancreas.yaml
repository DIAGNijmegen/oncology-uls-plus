# ULS23 Radboudumc Pancreas Dataset Configuration
# Pancreatic lesion segmentation
#
# Run with: python uclp/uclp_preprocess.py --config configs/ULS23/uls23_radboudumc_pancreas.yaml

name: ULS23_Radboudumc_Pancreas
id: 47

adapter: uls23
input_images: /path/to/your/dataset/ULS23/ULS23_Radboudumc_Pancreas/images
input_labels: /path/to/your/dataset/ULS23/ULS23_Radboudumc_Pancreas/labels

output_dir: /path/to/output/nnUNet_raw

crop_size: [128, 128, 64]
num_augmentations: 3
offset_range_mm: 10.0
min_lesion_size_voxels: 20
random_seed: 42
